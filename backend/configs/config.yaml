server:
  port: 8080
  host: "localhost"
  mode: "debug" # debug, release, test

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "your_password_here"
  name: "url_shortener"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600 # seconds

jwt:
  secret: "your_super_secret_jwt_key_change_this_in_production"
  expiration: "24h"
  refresh_expiration: "168h" # 7 days

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"

app:
  name: "URL Shortener Service"
  env: "development"
  base_url: "http://localhost:8080"
  short_url_length: 7
